<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NODE_01 - DEAUTH CONTROLLER</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #0a0a0a;
            --bg-panel: #0d0d0d;
            --bg-input: #1a1a1a;
            --accent-orange: #ff7700;
            --accent-orange-dim: rgba(255, 119, 0, 0.15);
            --text-main: #ff7700;
            --text-bright: #ffffff;
            --text-dim: #888888;
            --text-body: #e0e0e0;
            --green: #2ecc71;
            --red: #e74c3c;
            --border-orange: #ff7700;
            --console-bg: #000000;
            --font-mono: 'Courier New', Consolas, Monaco, monospace;
        }

        [data-theme="light"] {
            --bg-dark: #f0f0f0;
            --bg-panel: #ffffff;
            --bg-input: #e8e8e8;
            --accent-orange: #ff7700;
            --accent-orange-dim: rgba(255, 119, 0, 0.12);
            --text-main: #cc6600;
            --text-bright: #1a1a1a;
            --text-dim: #777777;
            --text-body: #222222;
            --green: #27ae60;
            --red: #c0392b;
            --border-orange: #cc6600;
            --console-bg: #f8f8f8;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-body);
            font-family: var(--font-mono);
            font-size: 13px;
            height: 100vh;
            display: flex;
            overflow: hidden;
            padding: 12px;
            transition: background 0.3s, color 0.3s;
        }

        .dashboard-container {
            display: flex;
            width: 100%;
            height: 100%;
            gap: 12px;
        }

        /* SIDEBAR */
        .sidebar-left {
            width: 200px;
            background: var(--bg-dark);
            border: 2px solid var(--border-orange);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px 0 0 0;
            flex-shrink: 0;
            transition: background 0.3s, border 0.3s;
        }

        .brand-header {
            padding: 0 16px 16px 16px;
            border-bottom: 2px solid var(--border-orange);
            margin-bottom: 12px;
            transition: border 0.3s;
        }

        .brand-header .title {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--text-bright);
            letter-spacing: 2px;
            transition: color 0.3s;
        }

        .brand-header .status {
            font-size: 0.7rem;
            color: var(--text-dim);
            margin-top: 4px;
            transition: color 0.3s;
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            font-weight: bold;
            font-size: 0.9rem;
            letter-spacing: 1px;
            cursor: pointer;
            color: var(--text-bright);
            text-decoration: none;
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
            font-family: var(--font-mono);
            transition: color 0.3s, background 0.3s;
        }

        .nav-item.active {
            background-color: var(--accent-orange);
            color: #000000;
        }

        .nav-item:hover:not(.active) {
            background: var(--accent-orange-dim);
        }

        .sidebar-footer {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn-reboot {
            width: 100%;
            background-color: var(--accent-orange);
            color: #000;
            border: none;
            padding: 12px;
            font-family: var(--font-mono);
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
            letter-spacing: 1px;
            transition: opacity 0.2s;
        }
        .btn-reboot:hover {
            opacity: 0.8;
        }

        .btn-theme-toggle {
            width: 100%;
            background: transparent;
            border: 1px solid var(--border-orange);
            color: var(--text-main);
            padding: 8px;
            font-family: var(--font-mono);
            font-size: 0.7rem;
            cursor: pointer;
            letter-spacing: 1px;
            transition: background 0.3s, color 0.3s, border 0.3s;
        }
        .btn-theme-toggle:hover {
            background: var(--accent-orange);
            color: #000;
        }

        /* MAIN CONTENT */
        .main-wrapper {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow: hidden;
        }

        .top-bar {
            border: 2px solid var(--border-orange);
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-dark);
            transition: background 0.3s, border 0.3s;
        }

        .top-bar-title {
            font-size: 1rem;
            font-weight: bold;
            letter-spacing: 2px;
            color: var(--text-main);
            transition: color 0.3s;
        }

        /* GRID */
        .grid-content {
            display: grid;
            grid-template-columns: 1fr 2fr;
            grid-template-rows: auto 1fr;
            gap: 12px;
            flex-grow: 1;
            min-height: 0;
        }

        .panel {
            background: var(--bg-panel);
            border: 2px solid var(--border-orange);
            padding: 12px;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: background 0.3s, border 0.3s;
        }

        .panel-badge {
            position: absolute;
            top: -1px;
            left: -1px;
            background: var(--accent-orange);
            color: #000;
            font-size: 0.65rem;
            font-weight: bold;
            padding: 2px 8px;
            letter-spacing: 1px;
        }

        /* DEAUTH STATUS */
        .panel-deauth {
            grid-column: 1;
            grid-row: 1;
            padding-top: 24px;
        }

        .deauth-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-top: 8px;
        }

        .status-big {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--text-bright);
            letter-spacing: 2px;
            transition: color 0.3s;
        }
        .status-big.idle {
            color: var(--text-dim);
        }
        .status-big.running {
            color: var(--green);
            animation: blink 0.7s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        .status-sub {
            font-size: 0.65rem;
            color: var(--text-dim);
            letter-spacing: 1px;
            margin-top: 2px;
            transition: color 0.3s;
        }

        .deauth-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 16px;
        }

        .btn-action {
            background: transparent;
            border: 2px solid var(--border-orange);
            color: var(--text-bright);
            padding: 10px;
            font-family: var(--font-mono);
            font-weight: bold;
            font-size: 0.75rem;
            cursor: pointer;
            text-align: center;
            letter-spacing: 1px;
            transition: all 0.2s;
        }
        .btn-action:hover {
            opacity: 0.8;
        }
        .btn-action.filled {
            background: var(--accent-orange);
            color: #000;
        }
        .btn-action.filled:hover {
            opacity: 0.8;
        }
        .btn-action.danger {
            border-color: var(--red);
            color: var(--red);
        }
        .btn-action.danger.filled {
            background: var(--red);
            color: #000;
        }
        .btn-action:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* STATS */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-top: 12px;
            font-size: 0.7rem;
            color: var(--text-dim);
            transition: color 0.3s;
        }
        .stats-grid .value {
            color: var(--text-bright);
            font-weight: bold;
            transition: color 0.3s;
        }

        /* PANEL NETWORKS */
        .panel-networks {
            grid-column: 1 / span 2;
            grid-row: 2;
            padding-top: 24px;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .networks-table-container {
            overflow-y: auto;
            margin-top: 8px;
            flex-grow: 1;
        }
        .networks-table-container::-webkit-scrollbar {
            width: 4px;
        }
        .networks-table-container::-webkit-scrollbar-track {
            background: var(--bg-dark);
        }
        .networks-table-container::-webkit-scrollbar-thumb {
            background: var(--accent-orange);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            font-size: 0.7rem;
            color: var(--text-main);
            padding: 8px;
            border-bottom: 1px solid rgba(255, 119, 0, 0.3);
            letter-spacing: 1px;
            transition: color 0.3s, border 0.3s;
        }

        td {
            padding: 10px 8px;
            font-size: 0.8rem;
            color: var(--text-bright);
            border-bottom: 1px solid rgba(255, 119, 0, 0.1);
            transition: color 0.3s, border 0.3s;
        }

        tr.selected td {
            background: var(--accent-orange);
            color: #000;
            font-weight: bold;
        }

        .checkbox-col {
            width: 30px;
            text-align: center;
        }
        input[type="checkbox"] {
            accent-color: var(--accent-orange);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .networks-footer {
            display: flex;
            justify-content: space-between;
            font-size: 0.65rem;
            color: var(--text-main);
            border-top: 1px solid rgba(255, 119, 0, 0.3);
            padding-top: 8px;
            margin-top: 8px;
            transition: color 0.3s, border 0.3s;
        }

        /* CONSOLE */
        .panel-console {
            border: 2px solid var(--border-orange);
            padding: 12px;
            position: relative;
            padding-top: 24px;
            display: flex;
            gap: 12px;
            height: 100px;
            background: var(--bg-panel);
            transition: background 0.3s, border 0.3s;
        }

        .console-box {
            flex-grow: 1;
            background: var(--console-bg);
            border: 1px solid rgba(255, 119, 0, 0.3);
            padding: 8px;
            font-size: 0.75rem;
            overflow-y: auto;
            color: var(--text-bright);
            transition: background 0.3s, color 0.3s, border 0.3s;
        }
        .console-box::-webkit-scrollbar {
            width: 4px;
        }
        .console-box::-webkit-scrollbar-track {
            background: var(--bg-dark);
        }
        .console-box::-webkit-scrollbar-thumb {
            background: var(--accent-orange);
        }

        .console-line { margin-bottom: 4px; }
        .tag-info { color: var(--green); }
        .tag-warn { color: var(--accent-orange); }
        .tag-error { color: var(--red); }
        .tag-success { color: var(--green); }

        .console-actions {
            display: flex;
            gap: 10px;
            width: 100px;
            flex-shrink: 0;
        }
        .console-actions .btn-action {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--accent-orange);
            color: #000;
            border: none;
            font-size: 0.65rem;
        }
        .console-actions .btn-action:hover {
            opacity: 0.8;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            body { padding: 6px; height: auto; overflow-y: auto; }
            .dashboard-container { flex-direction: column; height: auto; gap: 8px; }
            .sidebar-left { width: 100%; flex-direction: row; flex-wrap: wrap; padding: 10px; align-items: center; }
            .sidebar-left .brand-header { border-bottom: none; margin-bottom: 0; padding: 0; flex: 1; min-width: 120px; }
            .sidebar-left .brand-header .title { font-size: 1rem; }
            .sidebar-left .nav-menu { flex-direction: row; flex-wrap: wrap; gap: 4px; }
            .sidebar-left .nav-item { padding: 6px 12px; font-size: 0.7rem; width: auto; }
            .sidebar-left .sidebar-footer { display: flex; flex-direction: row; padding: 4px 0; width: 100%; gap: 6px; }
            .sidebar-left .sidebar-footer .btn-reboot { padding: 6px 12px; font-size: 0.65rem; flex: 1; }
            .sidebar-left .sidebar-footer .btn-theme-toggle { padding: 6px 12px; font-size: 0.65rem; flex: 1; }
            .grid-content { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr; }
            .panel-deauth { grid-column: 1; grid-row: 1; }
            .panel-networks { grid-column: 1; grid-row: 2; }
            .panel-console { flex-direction: column; height: auto; min-height: 80px; padding: 8px; padding-top: 20px; }
            .console-actions { width: 100%; }
            .deauth-actions { grid-template-columns: 1fr 1fr; gap: 6px; }
            .stats-grid { grid-template-columns: 1fr 1fr; font-size: 0.6rem; }
            .panel { padding: 8px; }
            .status-big { font-size: 1.3rem; }
            th, td { padding: 4px 6px; font-size: 0.6rem; }
        }
    </style>
</head>
<body>

<div class="dashboard-container">

    <!-- SIDEBAR -->
    <aside class="sidebar-left">
        <div>
            <div class="brand-header">
                <div class="title">NODE_01</div>
                <div class="status" id="status-text">STATUS: READY</div>
            </div>
            <nav class="nav-menu">
                <button class="nav-item active" onclick="scanNetworks()">
                    <span>📡</span> SCAN
                </button>
            </nav>
        </div>
        <div class="sidebar-footer">
            <button class="btn-reboot" onclick="rebootSystem()">⟳ REBOOT</button>
            <button class="btn-theme-toggle" onclick="toggleTheme()">☀/🌙 THEME</button>
        </div>
    </aside>

    <!-- MAIN -->
    <div class="main-wrapper">

        <header class="top-bar">
            <div class="top-bar-title">⚡ DEAUTH CONTROLLER</div>
            <div style="font-size:0.7rem;color:var(--text-dim);">
                <span id="method-indicator">MDK4</span>
            </div>
        </header>

        <div class="grid-content">

            <!-- DEAUTH STATUS -->
            <div class="panel panel-deauth">
                <div class="panel-badge">🎯 DEAUTH</div>
                <div class="deauth-header">
                    <div>
                        <div class="status-big idle" id="deauth-status-big">IDLE</div>
                        <div class="status-sub" id="deauth-command-text">SELECT TARGETS → START</div>
                    </div>
                </div>
                <div class="deauth-actions">
                    <button class="btn-action filled" id="btnStartDeauth" onclick="toggleDeauth()">▶ START</button>
                    <button class="btn-action" id="btnStopDeauth" onclick="stopDeauth()" disabled>⏹ STOP</button>
                </div>
                <div class="stats-grid">
                    <div>Targets: <span class="value" id="stats-targets">0</span></div>
                    <div>Packets: <span class="value" id="stats-packets">0</span></div>
                    <div>Duration: <span class="value" id="stats-duration">0s</span></div>
                    <div>Status: <span class="value" id="stats-status">Idle</span></div>
                </div>
            </div>

            <!-- NETWORKS -->
            <div class="panel panel-networks">
                <div class="panel-badge">📡 NETWORKS</div>
                <div style="display:flex;gap:10px;margin-top:24px;margin-bottom:6px;flex-wrap:wrap;align-items:center;">
                    <span style="font-size:0.65rem;color:var(--text-dim);">
                        SELECTED: <span id="selected-count">0</span>
                    </span>
                    <button class="btn-action" style="padding:2px 8px;font-size:0.55rem;" onclick="selectAll()">ALL</button>
                    <button class="btn-action" style="padding:2px 8px;font-size:0.55rem;" onclick="deselectAll()">NONE</button>
                </div>
                <div class="networks-table-container">
                    <table>
                        <thead>
                            <tr>
                                <th class="checkbox-col"><input type="checkbox" id="select-all" onchange="toggleAllCheckboxes()"></th>
                                <th>ESSID</th>
                                <th>BSSID</th>
                                <th>CH</th>
                                <th>SIGNAL</th>
                            </tr>
                        </thead>
                        <tbody id="network-body">
                            <tr><td colspan="5" style="text-align:center;color:var(--text-dim);padding:20px 0;">CLICK SCAN TO DISCOVER</td></tr>
                        </tbody>
                    </table>
                </div>
                <div class="networks-footer">
                    <div>Found: <span id="net-found">0</span></div>
                    <div id="scan-status">Ready</div>
                </div>
            </div>

        </div>

        <!-- CONSOLE -->
        <div class="panel-console">
            <div class="panel-badge">📟 CONSOLE</div>
            <div class="console-box" id="console-box">
                <div class="console-line"><span class="tag-info">[INFO]</span> NODE_01 DEAUTH CONTROLLER</div>
                <div class="console-line"><span class="tag-info">[INFO]</span> Select targets and START</div>
            </div>
            <div class="console-actions">
                <button class="btn-action" onclick="scanNetworks()">SCAN</button>
            </div>
        </div>

    </div>

</div>

<script>
// ============================================================
// STATE
// ============================================================
let networks = [];
let isDeauthRunning = false;
let selectedTargets = [];
let deauthStartTime = null;
let statsInterval = null;

// ============================================================
// THEME
// ============================================================
function toggleTheme() {
    const html = document.documentElement;
    const current = html.getAttribute('data-theme');
    if (current === 'light') {
        html.removeAttribute('data-theme');
        localStorage.setItem('theme', 'dark');
    } else {
        html.setAttribute('data-theme', 'light');
        localStorage.setItem('theme', 'light');
    }
}

(function loadTheme() {
    if (localStorage.getItem('theme') === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
    }
})();

// ============================================================
// CONSOLE
// ============================================================
function addConsoleLine(message, type = 'info') {
    const time = new Date().toTimeString().slice(0, 8);
    const tags = { info: 'tag-info', warn: 'tag-warn', error: 'tag-error', success: 'tag-success' };
    const box = document.getElementById('console-box');
    box.innerHTML += `<div class="console-line"><span class="${tags[type] || 'tag-info'}">[${type.toUpperCase()}]</span> ${message}</div>`;
    box.scrollTop = box.scrollHeight;
    if (box.children.length > 30) box.removeChild(box.firstChild);
}

// ============================================================
// SCAN
// ============================================================
function scanNetworks() {
    document.getElementById('status-text').textContent = 'STATUS: SCANNING...';
    document.getElementById('scan-status').textContent = 'Scanning...';
    addConsoleLine('Scanning networks...', 'info');

    fetch('/scan')
        .then(res => res.json())
        .then(data => {
            if (data.status === 'success') {
                networks = data.networks || [];
                renderTable(networks);
                document.getElementById('status-text').textContent = 'STATUS: READY';
                document.getElementById('scan-status').textContent = `Found ${networks.length}`;
                addConsoleLine(`Found ${networks.length} networks`, 'success');
            } else {
                addConsoleLine(`Error: ${data.message}`, 'error');
            }
        })
        .catch(err => {
            addConsoleLine(`Scan failed: ${err}`, 'error');
            document.getElementById('status-text').textContent = 'STATUS: ERROR';
        });
}

function renderTable(networks) {
    const tbody = document.getElementById('network-body');
    if (!networks || networks.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text-dim);padding:20px 0;">NO NETWORKS</td></tr>';
        return;
    }

    let html = '';
    networks.forEach(net => {
        const power = net.power !== null ? `${net.power}dBm` : '--';
        const checked = selectedTargets.some(t => t.bssid === net.bssid) ? 'checked' : '';
        html += `<tr class="${checked ? 'selected' : ''}">
            <td class="checkbox-col"><input type="checkbox" class="target-checkbox" 
                data-bssid="${net.bssid}" data-channel="${net.channel}" data-essid="${net.essid}" 
                ${checked} onchange="updateSelection()"></td>
            <td>${net.essid}</td>
            <td style="font-family:monospace;">${net.bssid}</td>
            <td>${net.channel}</td>
            <td>${power}</td>
        </tr>`;
    });
    tbody.innerHTML = html;
    updateSelection();
}

// ============================================================
// SELECTION
// ============================================================
function toggleAllCheckboxes() {
    const checked = document.getElementById('select-all').checked;
    document.querySelectorAll('.target-checkbox').forEach(cb => cb.checked = checked);
    updateSelection();
}

function selectAll() {
    document.querySelectorAll('.target-checkbox').forEach(cb => cb.checked = true);
    document.getElementById('select-all').checked = true;
    updateSelection();
}

function deselectAll() {
    document.querySelectorAll('.target-checkbox').forEach(cb => cb.checked = false);
    document.getElementById('select-all').checked = false;
    updateSelection();
}

function updateSelection() {
    const checkboxes = document.querySelectorAll('.target-checkbox:checked');
    selectedTargets = Array.from(checkboxes).map(cb => ({
        bssid: cb.dataset.bssid,
        channel: cb.dataset.channel,
        essid: cb.dataset.essid || 'Unknown'
    }));

    document.getElementById('selected-count').textContent = selectedTargets.length;
    document.getElementById('stats-targets').textContent = selectedTargets.length;

    document.querySelectorAll('#network-body tr').forEach(row => {
        const cb = row.querySelector('.target-checkbox');
        if (cb && cb.checked) row.classList.add('selected');
        else row.classList.remove('selected');
    });

    if (selectedTargets.length > 0) {
        document.getElementById('deauth-command-text').textContent = `${selectedTargets.length} TARGET(S) READY`;
    } else {
        document.getElementById('deauth-command-text').textContent = 'SELECT TARGETS → START';
    }
}

// ============================================================
// DEAUTH
// ============================================================
function toggleDeauth() {
    if (isDeauthRunning) stopDeauth();
    else startDeauth();
}

function startDeauth() {
    if (selectedTargets.length === 0) {
        addConsoleLine('Select at least 1 target!', 'warn');
        alert('Select at least 1 target!');
        return;
    }

    const btn = document.getElementById('btnStartDeauth');
    btn.disabled = true;
    btn.textContent = '...';
    document.getElementById('deauth-command-text').textContent = 'STARTING...';

    fetch('/start_deauth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ targets: selectedTargets.map(t => ({ 
            bssid: t.bssid, 
            channel: t.channel,
            essid: t.essid 
        }))})
    })
    .then(res => res.json())
    .then(data => {
        if (data.status === 'success') {
            isDeauthRunning = true;
            deauthStartTime = Date.now();
            document.getElementById('deauth-status-big').textContent = 'RUNNING';
            document.getElementById('deauth-status-big').className = 'status-big running';
            document.getElementById('deauth-command-text').textContent = `ATTACKING ${selectedTargets.length} TARGET(S)`;
            document.getElementById('btnStartDeauth').textContent = '● RUNNING';
            document.getElementById('btnStartDeauth').className = 'btn-action danger filled';
            document.getElementById('btnStopDeauth').disabled = false;
            document.getElementById('status-text').textContent = 'STATUS: DEAUTH ACTIVE';
            document.getElementById('stats-status').textContent = 'Attacking';
            document.getElementById('method-indicator').textContent = data.method || 'MDK4';
            
            addConsoleLine(`Deauth started on ${selectedTargets.length} targets with ${data.method}`, 'success');
            selectedTargets.forEach(t => {
                addConsoleLine(`→ ${t.bssid} (CH ${t.channel})`, 'info');
            });
            
            startStatsUpdate();
        } else {
            addConsoleLine(`Error: ${data.message}`, 'error');
            resetUI();
        }
    })
    .catch(err => {
        addConsoleLine(`Failed: ${err}`, 'error');
        resetUI();
    })
    .finally(() => {
        btn.disabled = false;
    });
}

function stopDeauth() {
    document.getElementById('btnStopDeauth').disabled = true;
    document.getElementById('deauth-command-text').textContent = 'STOPPING...';

    fetch('/stop_deauth', { method: 'POST' })
        .then(res => res.json())
        .then(data => {
            addConsoleLine('Deauth stopped', 'info');
            if (data.total_packets) {
                addConsoleLine(`Total packets sent: ${data.total_packets}`, 'info');
            }
            if (data.duration) {
                addConsoleLine(`Duration: ${data.duration}`, 'info');
            }
            resetUI();
        })
        .catch(err => {
            addConsoleLine(`Stop error: ${err}`, 'error');
            resetUI();
        });
}

function resetUI() {
    isDeauthRunning = false;
    deauthStartTime = null;
    if (statsInterval) {
        clearInterval(statsInterval);
        statsInterval = null;
    }
    document.getElementById('deauth-status-big').textContent = 'IDLE';
    document.getElementById('deauth-status-big').className = 'status-big idle';
    document.getElementById('deauth-command-text').textContent = selectedTargets.length > 0 ? 
        `${selectedTargets.length} TARGET(S) READY` : 'SELECT TARGETS → START';
    document.getElementById('btnStartDeauth').textContent = '▶ START';
    document.getElementById('btnStartDeauth').className = 'btn-action filled';
    document.getElementById('btnStopDeauth').disabled = true;
    document.getElementById('status-text').textContent = 'STATUS: READY';
    document.getElementById('stats-status').textContent = 'Idle';
    document.getElementById('stats-duration').textContent = '0s';
}

function startStatsUpdate() {
    if (statsInterval) clearInterval(statsInterval);
    statsInterval = setInterval(() => {
        fetch('/deauth_status')
            .then(res => res.json())
            .then(data => {
                if (data.running) {
                    document.getElementById('stats-packets').textContent = data.total_packets || 0;
                    document.getElementById('stats-duration').textContent = data.duration || '0s';
                    document.getElementById('stats-targets').textContent = data.total_targets || selectedTargets.length;
                }
            })
            .catch(() => {});
    }, 1000);
}

// ============================================================
// REBOOT
// ============================================================
function rebootSystem() {
    if (confirm('Reboot system?')) {
        if (isDeauthRunning) stopDeauth();
        addConsoleLine('Rebooting...', 'warn');
        setTimeout(() => location.reload(), 1500);
    }
}

// ============================================================
// INIT
// ============================================================
document.addEventListener('DOMContentLoaded', function() {
    addConsoleLine('NODE_01 DEAUTH CONTROLLER ONLINE', 'success');
    addConsoleLine('Press SCAN to find networks', 'info');
    setTimeout(scanNetworks, 1000);
});

// Keyboard shortcuts
document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && e.ctrlKey) { e.preventDefault(); scanNetworks(); }
    if (e.key === 'd' && e.ctrlKey) { e.preventDefault(); toggleDeauth(); }
    if (e.key === 'a' && e.ctrlKey) { e.preventDefault(); selectAll(); }
    if (e.key === 'u' && e.ctrlKey) { e.preventDefault(); deselectAll(); }
});
</script>
